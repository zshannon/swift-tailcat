name: Weekly official Tailcat update

"on":
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: swift-tailcat-upstream-${{ github.repository }}

jobs:
  update:
    if: github.repository == 'zshannon/swift-tailcat' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-xl
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      TAILCAT_BUILD_JOBS: 2
      TAILCAT_LOCAL_ARTIFACT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Freeze official HEAD and skip unchanged or previously proposed pins
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/update-upstream.py check --state "$RUNNER_TEMP/tailcat-update.json"
      - name: Install pinned Go without persistent caches
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.1"
      - name: Exercise offline updater and release script tests
        if: steps.upstream.outputs.changed == 'true'
        run: python3 -B -m unittest discover -s Scripts/tests -v
      - name: Regenerate source, run every validation gate, then propose one PR
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          TAILCAT_CACHE_ROOT: ${{ runner.temp }}/swift-tailcat-build-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source Scripts/environment.sh
          python3 -B Scripts/update-upstream.py update --state "$RUNNER_TEMP/tailcat-update.json"

# The script runs validation directly: token-created push events do not run CI,
# and token-created PR checks may need maintainer approval. No binary uploads,
# persistent Actions caches, auto-merge, tags, release steps, or publication.
